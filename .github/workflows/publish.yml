name: Publish RunTrackerOverlay

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      # Explicitly pointing to the .csproj file to fix the MSB1003 error
      run: dotnet restore RunTrackerOverlay/RunTrackerOverlay.csproj

    - name: Publish
      # Builds the single-file executable
      run: dotnet publish RunTrackerOverlay/RunTrackerOverlay.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:ReadyToRun=true -o ./publish

    - name: Upload Artifact
    # Uploads the exe as a workflow artifact for testing
      uses: actions/upload-artifact@v4
      with:
        name: RunTrackerOverlay-Windows
        path: ./publish/RunTrackerOverlay.exe